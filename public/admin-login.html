<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — CivicFix AI</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background-color: var(--color-offwhite);">
  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <span class="brand-icon"><i data-lucide="landmark" class="icon-20"></i></span>
        <div class="brand-text">
          <span class="brand-name">CivicFix AI</span>
          <span class="brand-sub">Admin Portal</span>
        </div>
      </a>
      <nav class="nav-group">
        <a href="/" class="nav-link" style="display: inline-flex; align-items: center; gap: 6px;">
          <i data-lucide="arrow-left" class="icon-16"></i> Back to Citizen Site
        </a>
      </nav>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px;">
    <div style="max-width: 400px; width: 100%;">
      <div class="card" style="border-top: 4px solid var(--color-dark-teal);">
        <div style="text-align: center; margin-bottom: 20px;">
          <div style="width: 48px; height: 48px; background-color: var(--color-green-light); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 8px;">
            <i data-lucide="lock" class="icon-24" style="color: var(--color-green);"></i>
          </div>
          <h1 style="font-size: 20px; margin-bottom: 4px;">Admin Portal Login</h1>
          <p style="color: var(--color-text-muted); font-size: 13px; margin-bottom: 0;">Sign in to review and triage complaints.</p>
        </div>

        <div id="loginAlert" class="alert" style="display: none;"></div>

        <form id="adminLoginForm" novalidate>
          <div class="form-group">
            <label for="adminEmail" class="form-label">Email Address</label>
            <input type="email" id="adminEmail" name="email" class="form-control" required value="admin@civicfix.local" placeholder="admin@civicfix.local">
          </div>
          <div class="form-group">
            <label for="adminPassword" class="form-label">Password</label>
            <input type="password" id="adminPassword" name="password" class="form-control" required value="admin123" placeholder="••••••••">
          </div>
          <button type="submit" id="btnLoginSubmit" class="btn btn-green" style="width: 100%; margin-top: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
            <i data-lucide="log-in" class="icon-16"></i> Sign In to Admin
          </button>
          <button type="button" id="btnQuickDemoLogin" class="btn btn-secondary" style="width: 100%; margin-top: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
            <i data-lucide="shield-check" class="icon-16"></i> One-Click Demo Admin Login
          </button>
        </form>

        <div style="margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--color-border); font-size: 11px; color: var(--color-text-muted);">
          <strong>Pre-Configured Demo Administrator:</strong><br>
          Email: <code class="mono">admin@civicfix.local</code><br>
          Password: <code class="mono">admin123</code>
        </div>
      </div>

      <p style="text-align: center; font-size: 11px; color: var(--color-text-muted); margin-top: 16px;">
        CivicFix AI is an independent student prototype.
      </p>
    </div>
  </main>

  <script src="/js/translations.js"></script>
  <script src="/js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('civicfix_admin_token');
      if (token) { window.location.href = '/admin'; return; }

      const form = document.getElementById('adminLoginForm');
      const emailInput = document.getElementById('adminEmail');
      const passwordInput = document.getElementById('adminPassword');
      const btnSubmit = document.getElementById('btnLoginSubmit');
      const alertBox = document.getElementById('loginAlert');

      const btnQuickDemo = document.getElementById('btnQuickDemoLogin');
      if (btnQuickDemo) {
        btnQuickDemo.addEventListener('click', () => {
          emailInput.value = 'admin@civicfix.local';
          passwordInput.value = 'admin123';
          form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        if (!email || !password) {
          alertBox.className = 'alert alert-error';
          alertBox.textContent = 'Please enter both email and password.';
          alertBox.style.display = 'block';
          return;
        }
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Verifying...';
        try {
          const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
          const json = await res.json();
          if (res.ok && json.success && json.data) {
            localStorage.setItem('civicfix_admin_token', json.data.token);
            if (json.data.user) localStorage.setItem('civicfix_admin_user', JSON.stringify(json.data.user));
            window.location.href = '/admin';
          } else {
            alertBox.className = 'alert alert-error';
            alertBox.textContent = json.error || 'Invalid email or password.';
            alertBox.style.display = 'block';
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<i data-lucide="log-in" class="icon-16"></i> Sign In to Admin';
            if (window.initIcons) window.initIcons();
          }
        } catch (err) {
          alertBox.className = 'alert alert-error';
          alertBox.textContent = 'Network error while attempting to sign in.';
          alertBox.style.display = 'block';
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<i data-lucide="log-in" class="icon-16"></i> Sign In to Admin';
          if (window.initIcons) window.initIcons();
        }
      });
    });
  </script>
</body>
</html>
