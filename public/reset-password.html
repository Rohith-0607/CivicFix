<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — CivicFix AI</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background-color: var(--color-offwhite);">
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <i data-lucide="landmark" class="icon-24" style="color: var(--color-lime);"></i>
        <div class="brand-text">
          <span class="brand-name">CivicFix AI</span>
          <span class="brand-sub">Community Issue Reporting</span>
        </div>
      </a>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px;">
    <div style="max-width: 420px; width: 100%;">
      <div class="card" style="border-top: 4px solid var(--color-dark-teal);">
        <div style="text-align: center; margin-bottom: 24px;">
          <div style="width: 52px; height: 52px; background-color: var(--color-green-light); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px;">
            <i data-lucide="lock" class="icon-24" style="color: var(--color-green);"></i>
          </div>
          <h1 style="font-size: 22px; margin-bottom: 6px;">Set New Password</h1>
          <p style="color: var(--color-text-muted); font-size: 13px; margin-bottom: 0;">Enter your new password below.</p>
        </div>

        <div id="resetAlert" class="alert" style="display: none;"></div>

        <form id="resetForm" novalidate>
          <div class="form-group">
            <label for="newPassword" class="form-label">New Password (Min 6 characters)</label>
            <input type="password" id="newPassword" name="password" class="form-control" required minlength="6" placeholder="••••••••">
          </div>

          <div class="form-group">
            <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
            <input type="password" id="confirmNewPassword" name="confirm_password" class="form-control" required minlength="6" placeholder="••••••••">
          </div>

          <button type="submit" id="btnResetSubmit" class="btn btn-green" style="width: 100%; margin-top: 8px;">
            <i data-lucide="check" class="icon-16"></i>
            <span id="resetBtnText">Update Password</span>
          </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--color-text-muted); border-top: 1px solid var(--color-border); padding-top: 16px;">
          <a href="/login" style="color: var(--color-green); font-weight: 600;">Back to Sign In</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Parse recovery token from URL hash (Supabase default) or search params
      let accessToken = null;
      if (window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        accessToken = hashParams.get('access_token');
      }
      if (!accessToken) {
        const queryParams = new URLSearchParams(window.location.search);
        accessToken = queryParams.get('access_token') || getAuthToken();
      }

      const alertBox = document.getElementById('resetAlert');
      const form = document.getElementById('resetForm');
      const passInput = document.getElementById('newPassword');
      const confirmInput = document.getElementById('confirmNewPassword');
      const btnSubmit = document.getElementById('btnResetSubmit');
      const btnText = document.getElementById('resetBtnText');

      if (!accessToken) {
        showAlert('Invalid or missing password recovery token. Please request a new reset link.', 'error');
        form.style.display = 'none';
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const password = passInput.value;
        const confirm = confirmInput.value;

        if (password.length < 6) {
          showAlert('Password must be at least 6 characters.', 'error');
          return;
        }

        if (password !== confirm) {
          showAlert('Passwords do not match.', 'error');
          return;
        }

        btnSubmit.disabled = true;
        btnText.textContent = 'Updating...';

        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${accessToken}`,
            },
            body: JSON.stringify({ password }),
          });

          const json = await res.json();

          if (res.ok && json.success) {
            clearAuthSession();
            window.location.href = '/login?msg=reset_success';
          } else {
            showAlert(json.error || 'Failed to update password.', 'error');
          }
        } catch (err) {
          showAlert('Network error. Unable to reach server.', 'error');
        } finally {
          btnSubmit.disabled = false;
          btnText.textContent = 'Update Password';
        }
      });

      function showAlert(msg, type = 'error') {
        alertBox.className = `alert alert-${type}`;
        alertBox.textContent = msg;
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
