<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — CivicFix AI</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background-color: var(--color-offwhite);">
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <i data-lucide="landmark" class="icon-24" style="color: var(--color-lime);"></i>
        <div class="brand-text">
          <span class="brand-name">CivicFix AI</span>
          <span class="brand-sub">Community Issue Reporting</span>
        </div>
      </a>
      <nav class="nav-group desktop-nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/login" class="nav-link">Sign In</a>
      </nav>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px;">
    <div style="max-width: 420px; width: 100%;">
      <div class="card" style="border-top: 4px solid var(--color-green);">
        <div style="text-align: center; margin-bottom: 24px;">
          <div style="width: 52px; height: 52px; background-color: var(--color-green-light); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px;">
            <i data-lucide="key-round" class="icon-24" style="color: var(--color-green);"></i>
          </div>
          <h1 style="font-size: 22px; margin-bottom: 6px;">Forgot Password</h1>
          <p style="color: var(--color-text-muted); font-size: 13px; margin-bottom: 0;">Enter your account email to receive a secure password reset link.</p>
        </div>

        <div id="forgotAlert" class="alert" style="display: none;"></div>

        <form id="forgotForm" novalidate>
          <div class="form-group">
            <label for="forgotEmail" class="form-label">Email Address</label>
            <input type="email" id="forgotEmail" name="email" class="form-control" required placeholder="you@example.com">
          </div>

          <button type="submit" id="btnForgotSubmit" class="btn btn-green" style="width: 100%; margin-top: 8px;">
            <i data-lucide="send" class="icon-16"></i>
            <span id="forgotBtnText">Send Reset Link</span>
          </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--color-text-muted); border-top: 1px solid var(--color-border); padding-top: 16px;">
          Remembered your password? <a href="/login" style="color: var(--color-green); font-weight: 600;">Back to Sign In</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgotForm');
      const emailInput = document.getElementById('forgotEmail');
      const btnSubmit = document.getElementById('btnForgotSubmit');
      const btnText = document.getElementById('forgotBtnText');
      const alertBox = document.getElementById('forgotAlert');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const email = emailInput.value.trim();
        if (!email) {
          showAlert('Please enter your email address.', 'error');
          return;
        }

        btnSubmit.disabled = true;
        btnText.textContent = 'Sending...';

        try {
          const res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
          });

          const json = await res.json();
          showAlert(json.message || 'If an account exists with this email, a reset link has been sent.', 'success');
          form.reset();
        } catch (err) {
          showAlert('Network error. Unable to reach server.', 'error');
        } finally {
          btnSubmit.disabled = false;
          btnText.textContent = 'Send Reset Link';
        }
      });

      function showAlert(msg, type = 'error') {
        alertBox.className = `alert alert-${type}`;
        alertBox.textContent = msg;
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
